<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page 2</title>
</head>
<body>

  <h1>Page 2</h1>
  <div id="paragraph-container"></div>

  <script>
    // Écoute les messages postMessage
    window.addEventListener('message', event => {
      // Sécurité : on peut vérifier event.origin si besoin
      if (event.data && event.data.action === 'addParagraph') {
        const p = document.createElement('p');
        p.textContent = 'Paragraphe ajouté depuis page 1 !';
        document.getElementById('paragraph-container').appendChild(p);
      }
    });
  </script>
</body>
</html>
